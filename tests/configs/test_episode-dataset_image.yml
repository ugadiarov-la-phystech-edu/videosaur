experiment_group: test
experiment_name: test_dummy_image

globals:
  NUM_SLOTS: 7
  SLOT_DIM: 16
  FEAT_DIM: 384
  NUM_PATCHES: 196

dataset:
  name: EpisodeDataModule
  input_size: 224
  batch_size: 2
  num_workers: 0
  extension: JPEG
  kind: image
  sequence_length: 1

trainer:
  max_steps: 100

optimizer:
  name: Adam
  lr: 3e-4

model:
  input_type: image
  visualize: false

  initializer:
    name: RandomInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: vit_small_patch16_224
      features: vit_block12
      frozen: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.FEAT_DIM}
    slot_dim: ${globals.SLOT_DIM}

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [128, 128]
    n_patches: ${globals.NUM_PATCHES}

val_metrics:
  ari:
    name: ImageARI
    ignore_background: true
    pred_key: decoder_masks_hard
    true_key: masks

comet:
  project: null
  run_name: test
  run_id: null